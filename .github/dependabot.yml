# Security updates arrive as soon as an advisory is published (enabled in the
# repository settings). These are the routine version updates: grouped and
# monthly, so a static site gets at most two pull requests a month.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        update-types: [minor, patch]

  # The workflows pin actions to commit SHAs; Dependabot moves the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
