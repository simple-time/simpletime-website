name: Live check

# Once a week, what no pull request can catch: the real server and DNS
# (check-live.mjs) and the slow sweep over every page (axe in light and dark,
# reflow at 320 px). A failure here means something changed outside the repo –
# a Cloudflare setting, a DNS record, an expiring security.txt – or a page
# regressed in a way the per-PR sample did not cover.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live server and DNS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Check the live site
        run: node scripts/check-live.mjs

  site:
    name: Every page (axe, reflow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Sweep every page
        run: npm run test:site

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-sweep-results
          path: |
            playwright-report/
            test-results/
